<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Zero - Comunidad</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-campus-blue: #0088ff;
      --color-zero-purple: #9c27b0;
      --neon-blue-light: #71e0ff;
      --neon-purple-light: #ffbfff;
      --neon-green: #39ff14;
    }

    body {
      font-family: 'Orbitron', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #E0E0E0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      justify-content: center;
      padding: 10px;
      box-sizing: border-box;
    }

    .screen-container {
      width: 95%;
      max-width: 350px;
      background-color: rgba(10, 10, 20, 0.85);
      border: 2px solid #00FFFF;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
      padding: 15px;
      box-sizing: border-box;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      position: relative;
    }

    /* --- TÍTULO --- */
    .titulo-juego-container {
      text-align: center;
      font-family: 'Press Start 2P', cursive;
      line-height: 0.7;
      transform: scale(0.8);
      transform-origin: center top;
      margin: 10px 0;
    }

    .titulo-juego {
      font-size: 1.8rem; /* 👈 reducido de 2.2rem a 1.8rem */
      margin: 0;
      letter-spacing: 4px;
    }

    .titulo-efecto.blue {
      background-image: linear-gradient(0deg, #004d9c 30%, #4dd2ff 70%);
      -webkit-text-fill-color: transparent;
      -webkit-background-clip: text;
      text-shadow: 0 0 10px var(--color-campus-blue);
    }

    .titulo-efecto.purple {
      background-image: linear-gradient(0deg, #5e158d 30%, #e1b3f0 70%);
      -webkit-text-fill-color: transparent;
      -webkit-background-clip: text;
      text-shadow: 0 0 10px var(--color-zero-purple);
    }

    .lema-subtitulo {
      color: var(--neon-purple-light);
      font-style: italic;
      font-size: 0.9em;
      text-shadow: 0 0 8px var(--color-zero-purple);
      text-align: center;
      font-family: 'Inter', sans-serif;
      margin-top: -0.5rem;
      margin-bottom: 1rem;
    }

    .section-title {
      color: #FFD700;
      font-size: 15px;
      text-transform: uppercase;
      border-bottom: 1px dashed #FFD700;
      padding-bottom: 5px;
      font-family: 'Orbitron', sans-serif;
      margin-bottom: 10px;
    }

    .post {
      background-color: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 255, 255, 0.4);
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 0 8px rgba(0, 255, 255, 0.2);
    }

    .post-header {
      font-size: 0.75rem;
      color: var(--neon-blue-light);
      font-family: 'Inter', sans-serif;
    }

    .post img {
      width: 45%;
      border-radius: 6px;
      border: 1px solid rgba(0,255,255,0.3);
      box-shadow: 0 0 10px rgba(0,255,255,0.3);
    }

    .caption {
      font-size: 0.7rem;
      color: #ccc;
      font-style: italic;
      text-align: right;
    }

    .post-actions {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--neon-green);
    }

    .fab-button {
      position: absolute;
      width: 55px;
      height: 55px;
      background-color: var(--neon-green);
      color: #000;
      border-radius: 50%;
      font-size: 30px;
      bottom: 15px;
      right: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--neon-green);
      cursor: pointer;
      transition: 0.2s ease;
    }

    .fab-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px var(--neon-green);
    }

  </style>
</head>
<body>
  <div class="screen-container">
    <div class="titulo-juego-container">
      <h1 class="titulo-juego titulo-efecto blue"></h1>
      <h1 class="titulo-juego titulo-efecto purple">COMUNIDAD</h1>
    </div>

    <p class="lema-subtitulo">-- Red de Operadores: Transmisiones --</p>

    <div class="section-title">Feed de Transmisiones</div>

    <div class="post">
      <div class="post-header">@unit_delta09</div>
      <img src="assets/img/Live.avif" alt="Transmisión de campo">
      <div class="caption">Sector Delta — Coordenadas 45.21</div>
      <div class="post-actions">
        <span>❤️ 1.2K</span>
        <span>💬 345</span>
      </div>
    </div>

    <div class="post">
      <div class="post-header">@beta_network</div>
      <img src="assets/img/Live.avif" alt="Interfaz de datos">
      <div class="caption">Anexo de datos — Canal encriptado</div>
      <div class="post-actions">
        <span>❤️ 890</span>
        <span>💬 124</span>
      </div>
    </div>

    <div class="fab-button">+</div>
  </div>
</body>
</html>
